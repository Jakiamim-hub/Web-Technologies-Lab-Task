<!DOCTYPE html>
<html>

<head>
	<title>Registration Form</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<h1>Registration Form</h1>
	<form>

		<div>
			<label for="fullname">Fullname:</label>
			<input type="text" name="fullname" id="fullname" required>
		</div>
		<br>

		<div>
			<label for="email">Email:</label>
			<input type="email" name="email" id="email" required>
		</div>
		<br>

		<div>
			<label for="password">Password:</label>
			<input type="password" name="password" id="password" required>
		</div>
		<br>

		<div>
			<label for="dob">Date of birth:</label>
			<input type="date" name="dob" id="dob">
		</div>
		<br>

		<div>
			<label for="photo">Choose your photo:</label>
			<input type="file" name="photo" id="photo">
		</div>
		<br>

		<div>
			<label>Gender:</label>
			<input type="radio" name="gender" id="gender1" value="Male">Male
			<input type="radio" name="gender" id="gender2" value="Female">Female
		</div>
		<br>

		<div>
			<label>Religion:</label>
			<input type="radio" name="Religion" id="Religion" value="Islam">Islam
			<input type="radio" name="Religion" id="Religion" value="Hindu">Hindu
		</div>
		<br>

		<div>
			<label for="department">Department:</label>
			<select name="department" id="department">
				<option value="CSE" selected>CSE</option>
				<option value="EEE">EEE</option>
			</select>
		</div>
		<br>

		<div>
			<label for="address">Write down the address:</label>
			<textarea name="address" id="address" rows="10"></textarea>
		</div>
		<br>

		<input type="submit" value="Submit">
		<input type="reset" value="Reset">

	</form>

</body>
</html>
